customCommands:
  - key: "<c-a>"
    context: "files"
    description: "AI로 커밋 메시지 생성 후 커밋"
    # output: terminal → lazygit을 잠시 내려두고 스크립트가 터미널을 직접 제어한다.
    # 덕분에 생성 중 스피너/경과시간을 표시하고, 완료 후 에디터로 메시지를 수정할 수 있다.
    output: terminal
    command: >-
      bash -c 'd="$HOME/Library/Application Support/lazygit";
      [ -d "$d" ] || d="${XDG_CONFIG_HOME:-$HOME/.config}/lazygit";
      exec bash "$d/scripts/ai-commit.sh"'
