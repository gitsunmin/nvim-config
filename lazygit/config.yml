customCommands:
  - key: "<c-a>"
    context: "files"
    description: "AI로 커밋 메시지 생성 후 커밋"
    loadingText: "Claude가 staged diff를 분석해 커밋 메시지를 생성하는 중..."
    prompts:
      - type: "input"
        title: "커밋 메시지 (AI 생성 - 자유롭게 수정 가능)"
        key: "CommitMessage"
        initialValue: "{{ runCommand \"'/Users/kimsunmin/Library/Application Support/lazygit/scripts/ai-commit-msg.sh'\" }}"
    command: "git commit -m {{.Form.CommitMessage | quote}}"
