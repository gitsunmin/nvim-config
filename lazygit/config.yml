customCommands:
  - key: "<c-a>"
    context: "files"
    description: "AI로 커밋 메시지 생성 후 커밋"
    # output: terminal → lazygit을 잠시 내려두고 스크립트가 터미널을 직접 제어한다.
    # 덕분에 생성 중 스피너/경과시간을 표시하고, 완료 후 에디터로 메시지를 수정할 수 있다.
    output: terminal
    command: >-
      bash -c 'd="$HOME/Library/Application Support/lazygit";
      [ -d "$d" ] || d="${XDG_CONFIG_HOME:-$HOME/.config}/lazygit";
      exec bash "$d/scripts/ai-commit.sh"'

git:
  # difftastic(difft)으로 구문 인식 diff를 보여준다. `|` / `\` 키로 아래 순서대로 전환한다.
  # extDiff는 git의 --ext-diff로 difft를 호출하므로 lazygit 안에서만 적용되고,
  # 전역 git diff(diff.external)나 gitsigns에는 영향을 주지 않는다.
  diffRenderers:
    - type: extDiff
      name: difft side-by-side
      command: difft --color=always --display=side-by-side-show-both --context={{diffContext}}
    - type: extDiff
      name: difft inline
      command: difft --color=always --display=inline --context={{diffContext}}
    # git 기본 diff: difft는 보기 전용이라 라인 단위 staging 화면은 이 형식을 쓴다.
    - type: rawGit
      name: default
